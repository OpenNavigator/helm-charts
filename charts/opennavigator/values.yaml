# Default values for opennavigator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: openinsight-proj/opennavigator
  tag: 377008eae688dfa6221bb6c24b1b43127f42f9f6
  pullPolicy: IfNotPresent

config: |
  opAMPServer:
    network:
      host: 0.0.0.0
      port: 4320
  apiServer:
    network:
      host: 0.0.0.0
      port: 4200
  storage:
    type: mysql
    dsn: root:root@tcp({{ .Release.Name }}-mysql:3306)/opennavigator?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true
  telemetry:
    logging:
      level: info
      output: stdout

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  apiServerPort: 4200
  opAMPServerPort: 4320

resources:
   limits:
     cpu: 100m
     memory: 128Mi
   requests:
     cpu: 100m
     memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  enabled: true
  image:
    registry: docker.m.daocloud.io
    repository: mysql
    tag: 8.0.29
    pullPolicy: IfNotPresent
  password: root
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 100m
      memory: 200Mi
